<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LinkKeeper (Beta): Affiliate Link and SEO Checker</title>
<meta name="description" content="LinkKeeper scans any page for dead links, missing affiliate disclosures and SEO gaps, then gives a fix list.">
<link rel="canonical" href="https://linkkeeper.leonlink.net/"><meta name="robots" content="noindex">
<meta property="og:title" content="LinkKeeper (Beta)"><meta property="og:description" content="Find dead affiliate links, missing disclosures and SEO gaps.">
<style>body{font-family:system-ui,sans-serif;background:#111;color:#eee;max-width:900px;margin:auto;padding:20px}.beta{background:#c9a227;color:#111;padding:6px;border-radius:6px;font-weight:700;text-align:center}input{width:70%;padding:10px;font-size:16px}button{padding:10px 18px;font-size:16px;background:#c9a227;border:0;border-radius:6px;cursor:pointer}.card{background:#1d1d1d;border-radius:8px;padding:14px;margin:12px 0}.bad{color:#ff6b6b}.ok{color:#6bdc7b}table{width:100%;border-collapse:collapse;font-size:13px}td{border-bottom:1px solid #333;padding:4px;word-break:break-all}</style></head>
<body><div class="beta">BETA: LinkKeeper v0.1 rough draft</div><h1>LinkKeeper</h1>
<p>Paste a page address. LinkKeeper checks up to 60 links, looks for an affiliate disclosure and lists SEO gaps.</p>
<form id="f"><input id="u" placeholder="https://leonlink.net/" required> <button>Scan</button></form>
<div id="out"></div><button id="dl" style="display:none">Download report (CSV)</button>
<script>
let last;const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const row=x=>`<tr><td class="${x.status&&x.status<400?'ok':'bad'}">${x.status||'no reply'}</td><td>${x.affiliate?'$':''}</td><td>${esc(x.url)}</td></tr>`;
$('#f').onsubmit=async e=>{e.preventDefault();$('#out').innerHTML='<p>Scanning (up to 30 seconds)...</p>';$('#dl').style.display='none';
try{const r=await fetch('/api/scan?url='+encodeURIComponent($('#u').value));const d=await r.json();if(d.error)throw d.error;last=d;
const D=d.disclosure;$('#out').innerHTML=`<div class=card><h2>Score: ${d.score}/100</h2>${d.linksChecked} links checked, ${d.affiliateLinks} affiliate</div>
<div class=card><h3>Dead links (${d.dead.length})</h3>${d.dead.length?'<table>'+d.dead.map(row).join('')+'</table>':'<p class=ok>None found</p>'}</div>
<div class=card><h3>Affiliate disclosure</h3><p class="${D.ok?'ok':'bad'}">${!D.needed?'No affiliate links, none needed':D.found?'Disclosure found':'Affiliate links but NO disclosure - add one near the top'}</p></div>
<div class=card><h3>SEO gaps (${d.seo.issues.length})</h3>${d.seo.issues.length?'<ul>'+d.seo.issues.map(i=>'<li class=bad>'+esc(i)+'</li>').join('')+'</ul>':'<p class=ok>None found</p>'}</div>
<div class=card><h3>All links</h3><table>${d.links.map(row).join('')}</table></div>`;$('#dl').style.display='inline-block'}catch(err){$('#out').innerHTML='<p class=bad>Error: '+esc(err)+'</p>'}};
$('#dl').onclick=()=>{const rows=[['status','affiliate','url'],...last.links.map(l=>[l.status,l.affiliate,l.url])];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'}));a.download='linkkeeper-report.csv';a.click()};
</script></body></html>
